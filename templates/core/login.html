<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - M&S Tools</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1B2A4A 0%, #2C3E6B 50%, #3A5A8C 100%);
            position: relative;
            overflow: hidden;
        }
        
        /* Fondo con figuras decorativas */
        body::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(245, 166, 35, 0.08) 0%, transparent 70%);
            top: -200px;
            right: -200px;
            border-radius: 50%;
        }
        
        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(245, 166, 35, 0.06) 0%, transparent 70%);
            bottom: -150px;
            left: -150px;
            border-radius: 50%;
        }
        
        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        
        .login-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 45px 40px 35px 40px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
        }
        
        .login-card:hover {
            transform: translateY(-4px);
        }
        
        /* Logo */
        .logo-container {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo-circle {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1B2A4A 0%, #2C3E6B 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px auto;
            border: 3px solid #F5A623;
            box-shadow: 0 8px 30px rgba(245, 166, 35, 0.25);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            overflow: hidden;
        }
        
        .logo-circle:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 40px rgba(245, 166, 35, 0.35);
        }
        
        .logo-circle img {
            width: 65px;
            height: 65px;
            object-fit: contain;
        }
        
        .logo-circle i {
            font-size: 42px;
            color: #F5A623;
        }
        
        .logo-text {
            font-size: 24px;
            font-weight: 800;
            color: #1B2A4A;
            letter-spacing: -0.5px;
        }
        
        .logo-text span {
            color: #F5A623;
        }
        
        .logo-subtitle {
            font-size: 13px;
            color: #8899AA;
            font-weight: 400;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }
        
        /* Formulario */
        .form-label {
            font-weight: 600;
            font-size: 13px;
            color: #2C3E6B;
            margin-bottom: 5px;
        }
        
        .input-group-custom {
            position: relative;
            margin-bottom: 20px;
        }
        
        .input-group-custom .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #B0C0D0;
            font-size: 16px;
            transition: color 0.3s;
            z-index: 2;
        }
        
        .input-group-custom .form-control {
            padding: 13px 18px 13px 48px;
            border-radius: 12px;
            border: 2px solid #E8ECF1;
            background: #F8FAFC;
            font-size: 14px;
            transition: all 0.3s ease;
            height: 52px;
        }
        
        .input-group-custom .form-control:focus {
            border-color: #F5A623;
            background: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(245, 166, 35, 0.12);
        }
        
        .input-group-custom .form-control:focus + .input-icon {
            color: #F5A623;
        }
        
        .input-group-custom .form-control::placeholder {
            color: #B0C0D0;
            font-weight: 300;
        }
        
        /* Checkbox recordar */
        .form-check {
            margin-bottom: 22px;
        }
        
        .form-check-input {
            border-radius: 4px;
            border: 2px solid #D0D8E0;
            cursor: pointer;
            width: 18px;
            height: 18px;
        }
        
        .form-check-input:checked {
            background-color: #F5A623;
            border-color: #F5A623;
        }
        
        .form-check-label {
            font-size: 14px;
            color: #5A6A7A;
            cursor: pointer;
        }
        
        /* Botón */
        .btn-login {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #1B2A4A 0%, #2C3E6B 100%);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            height: 52px;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(27, 42, 74, 0.3);
        }
        
        .btn-login:active {
            transform: translateY(0);
        }
        
        .btn-login .shine {
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: left 0.6s;
        }
        
        .btn-login:hover .shine {
            left: 100%;
        }
        
        .btn-login i {
            margin-right: 10px;
        }
        
        /* Mensajes de error */
        .alert-custom {
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 14px;
            border: none;
            background: #FDEDEC;
            color: #C0392B;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .alert-custom i {
            font-size: 18px;
        }
        
        /* Footer */
        .login-footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #E8ECF1;
        }
        
        .login-footer p {
            font-size: 13px;
            color: #8899AA;
            margin: 0;
        }
        
        .login-footer .brand {
            color: #1B2A4A;
            font-weight: 600;
        }
        
        .login-footer .brand span {
            color: #F5A623;
        }
        
        /* Responsive */
        @media (max-width: 480px) {
            .login-card {
                padding: 30px 20px 25px 20px;
            }
            
            .logo-circle {
                width: 75px;
                height: 75px;
            }
            
            .logo-circle i {
                font-size: 32px;
            }
            
            .logo-text {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            
            <!-- Logo -->
            <div class="logo-container">
                <div class="logo-circle">
    <img src="/media/logos/logo_redondo.png" alt="M&S Tools" style="width: 65px; height: 65px; object-fit: contain; border-radius: 50%;">
</div>
                <div class="logo-text">M&S <span>TOOLS</span></div>
                <div class="logo-subtitle">Innovación en herramientas y accesorios</div>
            </div>
            
            <!-- Mensajes de error -->
            {% if messages %}
                {% for message in messages %}
                    <div class="alert-custom mb-3">
                        <i class="fas fa-{% if message.tags == 'error' %}exclamation-circle{% else %}info-circle{% endif %}"></i>
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
            
            <!-- Formulario -->
            <form method="post">
                {% csrf_token %}
                
                <div class="input-group-custom">
                    <input type="text" class="form-control" id="username" name="username" placeholder="Usuario" required autofocus>
                    <span class="input-icon"><i class="fas fa-user"></i></span>
                </div>
                
                <div class="input-group-custom">
                    <input type="password" class="form-control" id="password" name="password" placeholder="Contraseña" required>
                    <span class="input-icon"><i class="fas fa-lock"></i></span>
                </div>
                
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="remember">
                    <label class="form-check-label" for="remember">Recordarme</label>
                </div>
                
                <button type="submit" class="btn-login">
                    <span class="shine"></span>
                    <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                </button>
            </form>
            
            <!-- Footer -->
            <div class="login-footer">
                <p>&copy; {% now "Y" %} <span class="brand">M&S <span>TOOLS</span></span> - Sistema de Gestión v2.0</p>
            </div>
            
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
